plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'id.ruangtegak.app'
    compileSdk 35

    signingConfigs {
        release {
            if (System.getenv('RT_KEYSTORE_PATH')) {
                storeFile file(System.getenv('RT_KEYSTORE_PATH'))
                storeType 'JKS'
                storePassword System.getenv('RT_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RT_KEY_ALIAS')
                keyPassword System.getenv('RT_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('RT_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    defaultConfig {
        applicationId 'id.ruangtegak.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.5.0')
    implementation 'com.google.firebase:firebase-messaging'
}
