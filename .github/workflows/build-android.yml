name: Build APK Ruang Tegak

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode aplikasi
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ruang-Tegak-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Terbitkan APK untuk diunduh
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Ruang Tegak Android v1.0.0
          body: |
            APK Android Ruang Tegak.
            Aplikasi Android ini membuka layanan web Ruang Tegak versi terbaru.
            Unduh file app-debug.apk, lalu pasang di perangkat Android.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
