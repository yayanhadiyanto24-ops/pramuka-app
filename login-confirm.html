<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3b2619"><title>Konfirmasi Login · Ruang Tegak</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f4eee5;color:#302313;font-family:Arial,sans-serif}.card{width:min(100%,460px);background:#fff;border:1px solid #e4d2b4;border-radius:18px;padding:26px;box-shadow:0 10px 32px #39231618}h1{font-size:23px;margin:0 0 10px;color:#604323}.muted{color:#6b6257;line-height:1.55}.actions{display:flex;gap:10px;margin-top:22px}.actions button{flex:1;border:0;border-radius:10px;padding:14px 10px;font-weight:800;color:white;font-size:15px}.yes{background:#27733d}.no{background:#a52b2b}button:disabled{opacity:.5}.status{margin-top:18px;font-weight:700;line-height:1.5}.brand{font-size:12px;font-weight:bold;letter-spacing:2px;color:#987044;margin-bottom:18px}
</style></head><body><main class="card"><div class="brand">RUANG TEGAK</div><h1>Konfirmasi Login</h1><p id="question" class="muted">Memeriksa tautan konfirmasi...</p><div id="actions" class="actions" hidden><button id="confirm" type="button">YA, LANJUTKAN</button><button id="cancel" type="button">BUKAN SAYA</button></div><div id="status" class="status" role="status"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://bopxmtxfrlrnywwhywne.supabase.co";
const SUPABASE_KEY="sb_publishable_cVuaKtOM6yrSsQr1MNmzFg_HUv8mxw0";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const params=new URLSearchParams(location.search),token=params.get("token"),decision=params.get("decision");
const question=document.getElementById("question"),actions=document.getElementById("actions"),status=document.getElementById("status"),yes=document.getElementById("confirm"),no=document.getElementById("cancel");
if(!token||!["yes","no"].includes(decision)){question.textContent="Tautan tidak lengkap atau tidak valid.";status.textContent="Silakan kembali ke perangkat pemindai QR dan ulangi proses login."; }
else{question.textContent=decision==="yes"?"Apakah benar Anda yang sedang mencoba masuk ke Ruang Tegak menggunakan QR KTA?":"Apakah Anda ingin menolak permintaan login ini?";yes.hidden=decision!=="yes";no.hidden=decision!=="no";yes.textContent="YA, ITU SAYA";no.textContent="BUKAN SAYA";actions.hidden=false;}
async function decide(choice){yes.disabled=true;no.disabled=true;status.textContent="Mengirim keputusan...";try{const {data,error}=await client.functions.invoke("pramuka-register",{body:{action:"qr_login_decide",token,decision:choice}});if(error)throw error;if(!data?.ok)throw new Error(data?.message||"Keputusan tidak dapat disimpan.");question.textContent=choice==="yes"?"Login telah disetujui.":"Permintaan login telah ditolak.";status.textContent=choice==="yes"?"Kembali ke perangkat yang memindai QR. Login akan dilanjutkan otomatis.":"Akun tidak akan dibuka melalui permintaan ini.";actions.hidden=true;}catch(e){status.textContent=e.message||"Terjadi kendala. Tautan mungkin sudah kedaluwarsa.";yes.disabled=false;no.disabled=false;}}
yes.addEventListener("click",()=>decide("yes"));no.addEventListener("click",()=>decide("no"));
</script></body></html>
